<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Eduzah</title>
    <meta name="description" content="Eduzah شركة سوفتوير متخصصة في تقديم التدريبات التقنية في مجالات تطوير البرمجيات، الذكاء الاصطناعي، وتقنيات المعلومات."/>
    <meta name="keywords" content="Eduzah, تدريب, تكنولوجيا, برمجة, سوفتوير, ذكاء اصطناعي, كورسات تقنية, مصر"/>
    <meta name="robots" content="index, follow"/>
    <meta property="og:title" content="Eduzah"/>
    <meta property="og:description" content="Eduzah — شركة سوفتوير متخصصة في تقديم التدريبات التقنية في مجالات تطوير البرمجيات والذكاء الاصطناعي"/>
    <meta property="og:type" content="website"/>

    <script>
      (function () {
        try {
          localStorage.removeItem("eduzah-theme");
        } catch (e) {}
        document.documentElement.dataset.theme = "dark";
      })();
    </script>

    <!-- ── Facebook Pixel ─────────────────────────────────────────────────── -->
    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      var _fbPixelId = '%VITE_FB_PIXEL_ID%';
      if (_fbPixelId && _fbPixelId !== '%VITE_FB_PIXEL_ID%') {
        fbq('init', _fbPixelId);
        fbq('track', 'PageView');
      }
    </script>

    <!-- ── DNS prefetch / preconnect ─────────────────────────────────────── -->
    <!-- Firebase services -->
    <link rel="dns-prefetch" href="//firestore.googleapis.com"/>
    <link rel="dns-prefetch" href="//identitytoolkit.googleapis.com"/>
    <link rel="dns-prefetch" href="//securetoken.googleapis.com"/>
    <link rel="dns-prefetch" href="//www.googleapis.com"/>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

    <!-- ── LCP image preload ──────────────────────────────────────────────── -->
    <!-- fetchpriority=high tells browser to fetch this before everything else -->
    <link rel="preload"
          href="/images/team-office-small.webp"
          as="image"
          type="image/webp"
          media="(max-width: 767px)"
          fetchpriority="high"/>
    <link rel="preload"
          href="/images/team-office.webp"
          as="image"
          type="image/webp"
          media="(min-width: 768px)"
          fetchpriority="high"/>

    <!-- ── Fonts ──────────────────────────────────────────────────────────── -->
    <!-- Load non-blocking via print trick, swap to all once loaded (no FOIT) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
          rel="stylesheet"
          media="print"
          onload="this.media='all'"/>
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    </noscript>

  </head>
  <body data-theme="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
